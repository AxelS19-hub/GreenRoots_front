version: '3.8'

services:
  green-roots:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PYTHONPATH=/usr/bin/python3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a Python service for data processing
  python-processor:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - green-roots
    profiles:
      - python
    restart: unless-stopped